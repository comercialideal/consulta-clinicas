<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Consulta de clínicas por CEP – Ideal Odonto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF2F5;--sf:#fff;--ink:#10263B;--mu:#566A7B;--ln:#D3DDE5;--br:#0B7480;--chip:#E1EFF1;--hd:#10263B;--hdi:#fff;--am:#F6BC45;--wb:#FFF1CF;--wi:#5A4200}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1722;--sf:#13222F;--ink:#E6EEF4;--mu:#93A5B5;--ln:#26394A;--br:#3CC0CC;--chip:#17323A;--hd:#0A1520;--wb:#3A2F12;--wi:#F3D48A}}
:root[data-theme="dark"]{--bg:#0B1722;--sf:#13222F;--ink:#E6EEF4;--mu:#93A5B5;--ln:#26394A;--br:#3CC0CC;--chip:#17323A;--hd:#0A1520;--wb:#3A2F12;--wi:#F3D48A}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--hd)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:0 18px}
.top{background:var(--hd);color:var(--hdi);padding:22px 0 34px}
.hd{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logo{background:#fff;border-radius:12px;padding:8px 14px;display:flex;align-items:center;gap:8px;min-height:50px;color:#0B7480;font:700 20px "Bricolage Grotesque",system-ui,sans-serif}
.logo img{height:44px;width:auto;display:block}
h1{font:700 clamp(1.35rem,4vw,1.85rem)/1.15 "Bricolage Grotesque",system-ui,sans-serif;margin:0}
#upd{margin:4px 0 0;opacity:.75;font-size:.9rem}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:16px;margin-top:-20px;padding:18px;box-shadow:0 6px 24px rgba(16,38,59,.12)}
.l{font-weight:600}
.in{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
#q{flex:1 1 240px;min-width:0;font:600 1.35rem "Bricolage Grotesque",system-ui,sans-serif;padding:12px 14px;border-radius:10px;border:2px solid var(--am);background:var(--wb);color:var(--ink)}
.go{background:var(--br);color:var(--hd);border:0;border-radius:10px;padding:0 26px;min-height:48px;font:700 1rem Figtree,system-ui,sans-serif;cursor:pointer}
.opts{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap}
.opts label{display:flex;flex-direction:column;gap:3px;font-size:.85rem;color:var(--mu)}
select{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:7px 10px;max-width:100%}
.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:20px 0 6px;flex-wrap:wrap;color:var(--mu);font-size:.92rem}
.warn{background:var(--wb);color:var(--wi);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.92rem}
.empty{padding:34px 12px;text-align:center;color:var(--mu)}
.card{display:grid;grid-template-columns:96px 1fr;background:var(--sf);border:1px solid var(--ln);border-radius:14px;margin:10px 0;overflow:hidden}
.rail{background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 6px;color:var(--br);text-align:center}
.rail b{font:700 1.9rem/1 "Bricolage Grotesque",system-ui,sans-serif}
.rail span{font-size:.78rem}
.body{padding:14px 16px;min-width:0}
h3{font:700 1.08rem/1.25 "Bricolage Grotesque",system-ui,sans-serif;margin:0}
.ad{margin:4px 0 8px;color:var(--mu);font-size:.93rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span,.chips button{background:var(--chip);color:var(--ink);border-radius:999px;padding:3px 10px;font:inherit;font-size:.8rem;border:0}
.chips button{cursor:pointer;color:var(--br);font-weight:600}
.chips .x{display:none}.chips.open .x{display:inline-block}
.act{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:1px solid var(--ln);border-radius:8px;padding:7px 12px;text-decoration:none;color:var(--ink);background:var(--sf);font:600 .9rem Figtree,system-ui,sans-serif;cursor:pointer}
.btn:hover{border-color:var(--br)}
.btn.wa{border-color:var(--br);color:var(--br)}
.mu{color:var(--mu);font-size:.9rem;align-self:center}
:focus-visible{outline:3px solid var(--am);outline-offset:2px}
footer{background:var(--hd);color:var(--hdi);margin-top:34px;padding:18px 0;font-size:.85rem}
footer p{margin:0;opacity:.8}
@media (max-width:520px){.card{grid-template-columns:1fr}.rail{flex-direction:row;gap:6px;justify-content:flex-start;padding:8px 16px}}
[hidden]{display:none!important}
.who{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:.85rem}
.who .btn{color:var(--ink)}
#adm{margin-top:16px}
#adm h2{font:700 1.15rem "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 4px}
#adm .step{border-top:1px solid var(--ln);margin-top:14px;padding-top:12px}
#adm p{margin:4px 0}
.opts label.r{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:.93rem}
.rep{line-height:1.7;font-size:.93rem}
.ok{background:var(--chip);color:var(--ink);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.92rem}
#adm-msg.warn{margin:10px 0}
</style>
</head>

let D={c:[],s:[],r:[],ufs:[],upd:""},C=D.c,S=D.s;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const norm=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const ufOf=n=>{const p=Math.floor(n/1000);for(const[a,b,u]of D.r)if(p>=a&&p<=b)return u;return""};
const dist=(a,b,c,d)=>{const r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,q=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 12742*Math.asin(Math.sqrt(q))};
const km=v=>v<10?v.toFixed(1).replace(".",",")+" km":Math.round(v).toLocaleString("pt-BR")+" km";
const fp=d=>d.length==11?`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`:d.length==10?`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`:d;
const addr=c=>[c.e&&(c.e+(c.nu?", "+c.nu:"")),c.cp,c.b,c.ci&&(c.ci+"/"+c.u)].filter(Boolean).join(" – ");
const spec=c=>c.s.map(i=>S[i]+(c.h&&S[i].startsWith("Urgência")?" 24 h":""));
let shown=[];

function locate(num){
  const uf=ufOf(num);
  let pool=C.filter(c=>c.p&&!c.ap&&c.la!=null);
  const same=pool.filter(c=>c.u==uf);
  if(same.length)pool=same;
  pool.sort((a,b)=>Math.abs(a.p-num)-Math.abs(b.p-num));
  const b=pool[0];
  const near=pool.slice(0,3).filter(c=>dist(b.la,b.lo,c.la,c.lo)<15);
  const sa=String(num).padStart(8,"0"),sb=String(b.p).padStart(8,"0");
  let sh=0;while(sh<8&&sa[sh]==sb[sh])sh++;
  return{la:near.reduce((s,c)=>s+c.la,0)/near.length,lo:near.reduce((s,c)=>s+c.lo,0)/near.length,ci:b.ci,u:b.u,sh,uf};
}
const msg=t=>{shown=[];$("#out").innerHTML=`<p class="empty">${t}</p>`};

async function run(){
  const q=$("#q").value.trim(),n=+$("#n").value,sp=$("#sp").value;
  if(!q)return msg("Digite o CEP do beneficiário para ver as clínicas mais próximas.");
  let list=C.filter(c=>!sp||c.s.includes(+sp)),rows,head,warns=[];
  if(/^[\d.\-\s]+$/.test(q)){
    const dg=q.replace(/\D/g,"");
    if(dg.length<7||dg.length>8)return msg("Digite o CEP completo, com 8 dígitos.");
    const num=+dg,cep=dg.padStart(8,"0"),fmt=cep.slice(0,5)+"-"+cep.slice(5);
    if(!ufOf(num))return msg(`Não reconhecemos o CEP ${fmt}. Confira os números digitados.`);
    const L=(msg("Localizando o CEP…"),await exactCep(cep))||locate(num);
    rows=list.filter(c=>c.la!=null).map(c=>({c,d:dist(L.la,L.lo,c.la,c.lo)})).sort((a,b)=>a.d-b.d).slice(0,n);
    head=`CEP ${fmt} · região de referência: ${esc(L.ci)}/${L.u}`;
    if(!D.ufs.includes(L.uf))warns.push(`Não há clínicas credenciadas em ${L.uf}. Mostrando as mais próximas em outras regiões.`);
    else if(L.sh<3)warns.push("Localização estimada de forma ampla: não há clínicas com CEP parecido na base. Confirme a cidade do beneficiário antes de indicar.");
    if(rows.length&&rows[0].d>50)warns.push(`A clínica mais próxima fica a ${km(rows[0].d)} do CEP informado.`);
  }else{
    const tk=norm(q).split(/\s+/).filter(Boolean);
    const m=list.filter(c=>tk.every(t=>c.k.includes(t))).sort((a,b)=>(a.u+a.ci+a.n).localeCompare(b.u+b.ci+b.n,"pt"));
    rows=m.slice(0,n).map(c=>({c,d:null}));
    head=`${m.length} clínica${m.length==1?"":"s"} encontrada${m.length==1?"":"s"} para “${esc(q)}”`;
  }
  if(!rows.length)return msg("Nenhuma clínica encontrada. Tente outra especialidade ou outro termo.");
  shown=rows.map(r=>r.c);
  $("#out").innerHTML=`<div class="meta"><span>${head}</span><button class="btn" type="button" data-all>Copiar todas</button></div>`+warns.map(w=>`<div class="warn">${w}</div>`).join("")+rows.map((r,i)=>card(r.c,i,r.d)).join("");
}

function card(c,i,d){
  const [v,u]=d==null?[i+1,""]:km(d).split(" ");
  const sc=spec(c),ch=sc.map((t,j)=>`<span${j>4?' class="x"':""}>${esc(t)}</span>`).join("")+(sc.length>5?`<button type="button" data-more>+${sc.length-5}</button>`:"");
  const ph=c.t.map(([d,w])=>`<a class="btn" href="tel:+55${d}">${fp(d)}</a>`+(w?`<a class="btn wa" href="https://wa.me/55${d}" target="_blank" rel="noopener">WhatsApp</a>`:"")).join("")||'<span class="mu">Telefone não informado</span>';
  const map="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent([c.e,c.nu,c.b,c.ci,c.u].filter(Boolean).join(", "));
  return `<article class="card"><div class="rail"><b>${v}</b><span>${d==null?"resultado":"km"+(c.ap?" (aprox.)":"")}</span></div><div class="body"><h3>${esc(c.n)}</h3><p class="ad">${esc(addr(c))}${c.cep?" · CEP "+c.cep:""}</p><div class="chips">${ch}</div><div class="act">${ph}<a class="btn" href="${map}" target="_blank" rel="noopener">Ver no mapa</a><button class="btn" type="button" data-copy="${i}">Copiar dados</button></div></div></article>`;
}
const txt=c=>[c.n,addr(c)+(c.cep?" – CEP "+c.cep:""),c.t.length?"Tel.: "+c.t.map(t=>fp(t[0])).join(" / "):"",c.s.length?"Especialidades: "+spec(c).join(", "):""].filter(Boolean).join("\n");
function copy(t,btn){
  const ok=()=>{const o=btn.textContent;btn.textContent="Copiado";setTimeout(()=>btn.textContent=o,1500)};
  const fb=()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){}a.remove()};
  (navigator.clipboard?navigator.clipboard.writeText(t).then(ok,fb):fb());
}
$("#out").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.more){b.parentNode.classList.add("open");b.remove()}
  else if(b.dataset.copy!=null)copy(txt(shown[+b.dataset.copy]),b);
  else if("all"in b.dataset)copy(shown.map((c,i)=>(i+1)+") "+txt(c)).join("\n\n"),b);
});
$("#f").addEventListener("submit",e=>{e.preventDefault();run()});
$("#n").onchange=$("#sp").onchange=run;
$("#q").addEventListener("input",e=>{const v=e.target.value;if(/^[\d.\-\s]+$/.test(v)&&v.replace(/\D/g,"").length==8)run()});
function setData(d){
  D=d;C=d.c;S=d.s;
  C.forEach(c=>{c.k=norm([c.n,c.b,c.ci,c.u,c.e].join(" "))});
  D.ufs=[...new Set(C.map(c=>c.u))];
  const cnt={};C.forEach(c=>c.s.forEach(i=>cnt[i]=(cnt[i]||0)+1));
  const U="Urgência e emergência",f=Object.keys(cnt).filter(i=>cnt[i]>=15).sort((a,b)=>(S[a]!=U)-(S[b]!=U)||cnt[b]-cnt[a]);
  const sp=$("#sp"),cur=sp.value;sp.length=1;f.forEach(i=>sp.add(new Option(S[i],i)));
  sp.value=[...sp.options].some(o=>o.value==cur)?cur:"";
  $("#upd").textContent=`${C.length.toLocaleString("pt-BR")} clínicas ativas · base atualizada em ${D.upd}`;
}

const gc=new Map();
async function exactCep(cep){
  if(gc.has(cep))return gc.get(cep);
  let r=null;
  try{
    const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),4000);
    const j=await(await fetch("https://brasilapi.com.br/api/cep/v2/"+cep,{signal:ctl.signal})).json();clearTimeout(tm);
    const k=j&&j.location&&j.location.coordinates,la=k&&parseFloat(k.latitude),lo=k&&parseFloat(k.longitude);
    if(isFinite(la)&&isFinite(lo)&&la>-34&&la<6&&lo>-74&&lo<-34)r={la,lo,ci:j.city,u:j.state,sh:8,uf:j.state};
  }catch(e){}
  gc.set(cep,r);return r;
}
msg("Carregando a base de clínicas…");
fetch("base.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw 0;return r.json()})
 .then(d=>{setData(d);msg("Digite o CEP do beneficiário para ver as clínicas mais próximas.")})
 .catch(()=>msg("Não foi possível carregar a base de clínicas (base.json). Confira se o arquivo está publicado junto com esta página."));
</script>
</body>
</html>
