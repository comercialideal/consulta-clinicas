<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Atualizar rede credenciada – Ideal Odonto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#EDF2F5;--sf:#fff;--ink:#10263B;--mu:#566A7B;--ln:#D3DDE5;--br:#0B7480;--chip:#E1EFF1;--hd:#10263B;--hdi:#fff;--am:#F6BC45;--wb:#FFF1CF;--wi:#5A4200}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1722;--sf:#13222F;--ink:#E6EEF4;--mu:#93A5B5;--ln:#26394A;--br:#3CC0CC;--chip:#17323A;--hd:#0A1520;--wb:#3A2F12;--wi:#F3D48A}}
:root[data-theme="dark"]{--bg:#0B1722;--sf:#13222F;--ink:#E6EEF4;--mu:#93A5B5;--ln:#26394A;--br:#3CC0CC;--chip:#17323A;--hd:#0A1520;--wb:#3A2F12;--wi:#F3D48A}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--hd)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:0 18px}
.top{background:var(--hd);color:var(--hdi);padding:22px 0 34px}
.hd{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logo{background:#fff;border-radius:12px;padding:8px 14px;display:flex;align-items:center;gap:8px;min-height:50px;color:#0B7480;font:700 20px "Bricolage Grotesque",system-ui,sans-serif}
.logo img{height:44px;width:auto;display:block}
h1{font:700 clamp(1.35rem,4vw,1.85rem)/1.15 "Bricolage Grotesque",system-ui,sans-serif;margin:0}
#upd{margin:4px 0 0;opacity:.75;font-size:.9rem}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:16px;margin-top:-20px;padding:18px;box-shadow:0 6px 24px rgba(16,38,59,.12)}
.l{font-weight:600}
.in{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
#q{flex:1 1 240px;min-width:0;font:600 1.35rem "Bricolage Grotesque",system-ui,sans-serif;padding:12px 14px;border-radius:10px;border:2px solid var(--am);background:var(--wb);color:var(--ink)}
.go{background:var(--br);color:var(--hd);border:0;border-radius:10px;padding:0 26px;min-height:48px;font:700 1rem Figtree,system-ui,sans-serif;cursor:pointer}
.opts{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap}
.opts label{display:flex;flex-direction:column;gap:3px;font-size:.85rem;color:var(--mu)}
select{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:7px 10px;max-width:100%}
.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:20px 0 6px;flex-wrap:wrap;color:var(--mu);font-size:.92rem}
.warn{background:var(--wb);color:var(--wi);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.92rem}
.empty{padding:34px 12px;text-align:center;color:var(--mu)}
.card{display:grid;grid-template-columns:96px 1fr;background:var(--sf);border:1px solid var(--ln);border-radius:14px;margin:10px 0;overflow:hidden}
.rail{background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 6px;color:var(--br);text-align:center}
.rail b{font:700 1.9rem/1 "Bricolage Grotesque",system-ui,sans-serif}
.rail span{font-size:.78rem}
.body{padding:14px 16px;min-width:0}
h3{font:700 1.08rem/1.25 "Bricolage Grotesque",system-ui,sans-serif;margin:0}
.ad{margin:4px 0 8px;color:var(--mu);font-size:.93rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span,.chips button{background:var(--chip);color:var(--ink);border-radius:999px;padding:3px 10px;font:inherit;font-size:.8rem;border:0}
.chips button{cursor:pointer;color:var(--br);font-weight:600}
.chips .x{display:none}.chips.open .x{display:inline-block}
.act{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:1px solid var(--ln);border-radius:8px;padding:7px 12px;text-decoration:none;color:var(--ink);background:var(--sf);font:600 .9rem Figtree,system-ui,sans-serif;cursor:pointer}
.btn:hover{border-color:var(--br)}
.btn.wa{border-color:var(--br);color:var(--br)}
.mu{color:var(--mu);font-size:.9rem;align-self:center}
:focus-visible{outline:3px solid var(--am);outline-offset:2px}
footer{background:var(--hd);color:var(--hdi);margin-top:34px;padding:18px 0;font-size:.85rem}
footer p{margin:0;opacity:.8}
@media (max-width:520px){.card{grid-template-columns:1fr}.rail{flex-direction:row;gap:6px;justify-content:flex-start;padding:8px 16px}}
[hidden]{display:none!important}
.who{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:.85rem}
.who .btn{color:var(--ink)}
#adm{margin-top:16px}
#adm h2{font:700 1.15rem "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 4px}
#adm .step{border-top:1px solid var(--ln);margin-top:14px;padding-top:12px}
#adm p{margin:4px 0}
.opts label.r{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:.93rem}
.rep{line-height:1.7;font-size:.93rem}
.ok{background:var(--chip);color:var(--ink);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.92rem}
#adm-msg.warn{margin:10px 0}
</style>
</head>

<div class="opts"><label class="r"><input type="radio" name="md" value="merge" checked> Atualizar e adicionar (mantém as demais clínicas)</label><label class="r"><input type="radio" name="md" value="replace"> Substituir a base inteira</label></div>
<div class="opts"><label class="r"><input type="checkbox" id="net" checked> Buscar a localização exata das clínicas sem LAT/LON na internet (mais lento)</label></div>
<div class="act"><input type="file" id="arq" accept=".xlsx,.xls,.csv" aria-label="Planilha da rede credenciada"></div></div>
<div id="adm-msg" aria-live="polite"></div><div id="adm-out"></div>
</section>
</main>
<footer><div class="wrap"><p>Ferramenta de atualização · Rede credenciada Ideal Odonto</p></div></footer>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const norm=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const RNG=[[1000, 19999, "SP"], [20000, 28999, "RJ"], [29000, 29999, "ES"], [30000, 39999, "MG"], [40000, 48999, "BA"], [49000, 49999, "SE"], [50000, 56999, "PE"], [57000, 57999, "AL"], [58000, 58999, "PB"], [59000, 59999, "RN"], [60000, 63999, "CE"], [64000, 64999, "PI"], [65000, 65999, "MA"], [66000, 68899, "PA"], [68900, 68999, "AP"], [69000, 69299, "AM"], [69300, 69399, "RR"], [69400, 69899, "AM"], [69900, 69999, "AC"], [70000, 72799, "DF"], [72800, 72999, "GO"], [73000, 73699, "DF"], [73700, 76799, "GO"], [76800, 76999, "RO"], [77000, 77995, "TO"], [78000, 78899, "MT"], [78900, 78999, "RO"], [79000, 79999, "MS"], [80000, 87999, "PR"], [88000, 89999, "SC"], [90000, 99999, "RS"]];
const ufOf=n=>{const p=Math.floor(n/1000);for(const[a,b,u]of RNG)if(p>=a&&p<=b)return u;return""};
const dist=(a,b,c,d)=>{const r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,q=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 12742*Math.asin(Math.sqrt(q))};
let D={c:[],s:[],r:RNG},C=D.c,S=D.s;
const SPM={"DIAGNOSTICO":"Diagnóstico","DENTISTICA":"Dentística","PERIODONTIA":"Periodontia","ENDODONTIA":"Endodontia","ORTODONTIA":"Ortodontia","ODONTOPEDIATRIA":"Odontopediatria","CIRURGIA":"Cirurgia","RADIOLOGIA":"Radiologia","CLAREAMENTO CASEIRO":"Clareamento caseiro","PROTESE DENTARIA":"Prótese dentária","PROTESE":"Prótese dentária","IMPLANTE":"Implantodontia","IMPLANTODONTIA":"Implantodontia","ESTOMATOLOGIA":"Estomatologia"};
const canon=s=>{const k=norm(s).replace(/\s+/g," ").trim().replace(/^\.+|\.+$/g,"").toUpperCase();if(!k||k=="X")return null;if(k.startsWith("URGENCIA"))return"Urgência e emergência";if(k.startsWith("PREVEN"))return"Prevenção";if(k.startsWith("CLINIC")&&k.includes("GERAL"))return"Clínica geral";const t=s.trim();return SPM[k]||t.charAt(0).toUpperCase()+t.slice(1).toLowerCase()};
const SMW=new Set(["DE","DA","DO","DAS","DOS","E","EM","NA","NO"]),UPW=new Set(["LTDA","ME","EPP","EIRELI","SS","II","III","IV","V","VI","S/A","SA","SP","RJ","MG","DF","ABC","SUS","RX","ATM"]);
const tc=s=>{s=String(s==null?"":s).replace(/\s+/g," ").trim();const L=[...s].filter(c=>c.toLowerCase()!=c.toUpperCase());if(!L.length||L.filter(c=>c==c.toUpperCase()).length/L.length<.6)return s;return s.split(" ").map((t,i)=>{const u=t.toUpperCase();return UPW.has(u)?u:SMW.has(u)&&i>0?u.toLowerCase():t.charAt(0).toUpperCase()+t.slice(1).toLowerCase()}).join(" ")};
const phs=raw=>{const o=[];String(raw==null?"":raw).split(/[\n;/,]+|\s+e\s+/).forEach(g=>{if(/pessoal/i.test(g))return;let d=g.replace(/\D/g,"");if((d.length==12||d.length==13)&&d.startsWith("55"))d=d.slice(2);if(d.length>11)d=d.replace(/^0+/,"");if(d.length!=10&&d.length!=11)return;if(!o.some(x=>x[0]==d))o.push([d,d.length==11&&d[2]=="9"&&!/sem/i.test(g)?1:0])});return o};
const keyOf=c=>norm([c.n,c.e,c.nu,c.ci].join("|")).replace(/\s+/g," ").trim();
const num=v=>{const x=parseFloat(String(v).replace(",","."));return isFinite(x)?x:null};
const avg=(a,k)=>a.reduce((s,x)=>s+x[k],0)/a.length;
const med=(a,k)=>{const v=a.map(x=>x[k]).sort((x,y)=>x-y);return v[v.length>>1]};
const HDR=["NOME FANTASIA","RAZÃO SOCIAL","CEP","ENDEREÇO","N","COMPLEMENTO","BAIRRO","CIDADE","UF","TELEFONE CELULAR","TELEFONE FIXO","ESPECIALIDADES","STATUS","LAT","LON"];
let PLAN=null,META=null,ROWS=null,armed=false,S2=[];
const idx=s=>{let i=S2.indexOf(s);if(i<0){S2.push(s);i=S2.length-1}return i};
const say=(t,c)=>{const m=$("#adm-msg");m.className=t?c:"";m.textContent=t||""};
const hoje=()=>new Date().toLocaleDateString("pt-BR");

function parseCSV(t){
  t=t.replace(/^\ufeff/,"");const l=t.split("\n")[0],d=(l.match(/;/g)||[]).length>(l.match(/,/g)||[]).length?";":",";
  const rows=[];let r=[],f="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch=='"')q=true;else if(ch==d){r.push(f);f=""}
    else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;r.push(f);f="";rows.push(r);r=[]}else f+=ch}
  if(f!==""||r.length){r.push(f);rows.push(r)}
  const h=rows.shift()||[];
  return rows.filter(x=>x.some(v=>v!=="")).map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]==null?"":x[i]])));
}
function toClin(r,H){
  const g=(...a)=>{for(const k of a){const o=H[k];if(o!==undefined&&r[o]!=null&&String(r[o]).trim()!=="")return String(r[o]).trim()}return""};
  const n=tc(g("nomefantasia","razaosocial")),u=g("uf").toUpperCase();
  if(!n||!/^[A-Z]{2}$/.test(u))return null;
  let dg=g("cep").replace(/\D/g,"");if(dg.length==7)dg=dg.padStart(8,"0");
  let p=0,bad=0;if(dg.length==8){p=+dg;if(ufOf(p)!=u){p=0;bad=1}}
  let la=num(g("lat")),lo=num(g("lon"));if(la==null||lo==null||!(la>-34&&la<6&&lo>-74&&lo<-34))la=lo=null;
  let h=0;const sp=[];
  g("especialidades").split(/[,;]+/).forEach(t=>{const c=canon(t);if(c){const i=idx(c);if(!sp.includes(i))sp.push(i);if(c.startsWith("Urgência")&&/24/.test(t))h=1}});
  const t=phs(g("telefonecelular"));phs(g("telefonefixo")).forEach(x=>{if(!t.some(y=>y[0]==x[0]))t.push(x)});
  const st=norm(g("status"));
  return{n,e:tc(g("endereco")),nu:g("n","numero"),cp:tc(g("complemento")),b:tc(g("bairro")),ci:tc(g("cidade")),u,cep:p?String(p).padStart(8,"0").replace(/(\d{5})(\d{3})/,"$1-$2"):"",p,t,s:sp,h,ap:0,la,lo,ativo:!st||st.startsWith("ativ"),bad};
}
/* Geocodificação: usa as clínicas já localizadas como referência (o navegador não acessa serviços externos de mapa) */
function estimate(c,ref){
  const same=ref.filter(x=>x.u==c.u);
  if(c.p){
    const pool=same.filter(x=>x.p).sort((a,b)=>Math.abs(a.p-c.p)-Math.abs(b.p-c.p)),b=pool[0];
    if(b){const sa=String(c.p).padStart(8,"0"),sb=String(b.p).padStart(8,"0");let sh=0;while(sh<8&&sa[sh]==sb[sh])sh++;
      if(sh>=5||norm(b.ci)==norm(c.ci)){const nr=pool.slice(0,3).filter(x=>dist(b.la,b.lo,x.la,x.lo)<15);return{la:avg(nr,"la"),lo:avg(nr,"lo"),m:"cep"}}}
  }
  const cc=same.filter(x=>c.ci&&norm(x.ci)==norm(c.ci));
  return cc.length?{la:med(cc,"la"),lo:med(cc,"lo"),m:"cidade"}:null;
}
const wbBlob=wb=>new Blob([XLSX.write(wb,{type:"array",bookType:"xlsx"})],{type:"application/octet-stream"});
const needX=()=>typeof XLSX=="undefined"&&(say("Não foi possível carregar o leitor de planilhas. Recarregue a página.","warn"),true);
function modelo(){
  if(needX())return;
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([HDR,
   ["CLÍNICA EXEMPLO ODONTOLOGIA","CLÍNICA EXEMPLO LTDA","01310-100","AVENIDA PAULISTA","1000","SALA 12","BELA VISTA","SÃO PAULO","SP","11999990000","1133330000","CLÍNICA GERAL, DENTÍSTICA, URGÊNCIA E EMERGÊNCIA 24 HRS","ATIVO","",""],
   ["OUTRO EXEMPLO ODONTO","","","RUA DAS FLORES","50","","CENTRO","CARAPICUÍBA","SP","","1144440000","ORTODONTIA","ATIVO","-23.52","-46.84"]]),"Rede");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["Como preencher"],
   ["1) Preencha a aba “Rede”, uma clínica por linha, e apague as duas linhas de exemplo."],
   ["2) Obrigatórios: NOME FANTASIA (ou RAZÃO SOCIAL) e UF. Informe o CEP ou a CIDADE para o sistema localizar a clínica."],
   ["3) LAT e LON são opcionais. Se estiverem vazias, o sistema estima a localização pelo CEP ou pela cidade e marca como aproximada."],
   ["4) ESPECIALIDADES: separe por vírgula."],
   ["5) STATUS: ATIVO inclui ou mantém a clínica. Qualquer outro valor (ex.: INATIVO) remove a clínica no modo “Atualizar e adicionar”."],
   ["6) No modo “Atualizar e adicionar”, a clínica é identificada por nome fantasia + endereço + número + cidade. Alterar um desses campos cria uma clínica nova."]]),"Instruções");
  baixar("modelo-rede-credenciada.xlsx",wbBlob(wb));
}
function exportar(){
  if(needX())return;
  const fm=d=>d.length==11?`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`:d;
  const rows=C.map(c=>[c.n,"",c.cep,c.e,c.nu,c.cp,c.b,c.ci,c.u,c.t.filter(x=>x[0].length==11).map(x=>x[0]).join(" / "),c.t.filter(x=>x[0].length==10).map(x=>x[0]).join(" / "),c.s.map(i=>S[i]).join(", "),"ATIVO",c.ap||c.la==null?"":c.la,c.ap||c.la==null?"":c.lo]);
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([HDR,...rows]),"Rede");
  baixar("rede-credenciada-atual.xlsx",wbBlob(wb));
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function getJ(url){const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),8000);try{const r=await fetch(url,{signal:ctl.signal});return r.ok?await r.json():null}catch(e){return null}finally{clearTimeout(tm)}}
async function geoNet(c,ref){
  const cc=ref.filter(x=>x.u==c.u&&c.ci&&norm(x.ci)==norm(c.ci));
  const est=estimate(c,ref);
  const ok=(la,lo)=>isFinite(la)&&isFinite(lo)&&la>-34&&la<6&&lo>-74&&lo<-34&&(!cc.length||dist(la,lo,med(cc,"la"),med(cc,"lo"))<60)&&(!est||est.m!="cep"||dist(la,lo,est.la,est.lo)<=15);
  if(c.p){const j=await getJ("https://brasilapi.com.br/api/cep/v2/"+String(c.p).padStart(8,"0")),k=j&&j.location&&j.location.coordinates;
    if(k){const la=parseFloat(k.latitude),lo=parseFloat(k.longitude);if(ok(la,lo))return{la,lo}}}
  if(c.e&&c.ci){await sleep(1100);
    const q=[c.e,c.nu,c.b,c.ci,c.u,"Brasil"].filter(Boolean).join(", ");
    const j=await getJ("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=br&q="+encodeURIComponent(q));
    if(j&&j[0]){const la=parseFloat(j[0].lat),lo=parseFloat(j[0].lon);if(ok(la,lo))return{la,lo}}}
  return null;
}
function baixar(n,d){const a=document.createElement("a");a.href=URL.createObjectURL(d instanceof Blob?d:new Blob([d]));a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
async function plano(){
  if(!ROWS)return;
  const mode=document.querySelector("input[name=md]:checked").value,net=$("#net").checked;
  S2=[...S];
  const H=Object.fromEntries(Object.keys(ROWS[0]||{}).map(k=>[norm(k).replace(/[^a-z]/g,""),k]));
  if(!(H.nomefantasia||H.razaosocial)||!H.uf)return say("Não encontrei as colunas obrigatórias (NOME FANTASIA e UF). Baixe o modelo para ver o formato esperado.","warn");
  const ref=C.filter(c=>c.la!=null&&!c.ap),mp=new Map(),todo=[];
  if(mode=="merge")C.forEach(c=>mp.set(keyOf(c),c));
  const R={novas:0,atual:0,rem:0,ign:0,inf:0,net:0,cep:0,cid:0,sem:0,prob:[],rev:[]};
  ROWS.forEach((r,i)=>{
    const c=toClin(r,H);
    if(!c){R.ign++;if(R.prob.length<12)R.prob.push(`Linha ${i+2}: sem nome ou sem UF válida. Ignorada.`);return}
    const k=keyOf(c);
    if(!c.ativo){if(mp.delete(k))R.rem++;else R.ign++;return}
    const old=mp.get(k);
    if(c.bad&&R.prob.length<12)R.prob.push(`Linha ${i+2}: o CEP não confere com a UF ${c.u}. CEP descartado.`);
    if(c.la!=null)R.inf++;
    else if(old&&old.la!=null&&!old.ap){c.la=old.la;c.lo=old.lo;R.inf++}
    else todo.push(c);
    old?R.atual++:R.novas++;mp.set(k,c);
  });
  for(let j=0;j<todo.length;j++){
    const c=todo[j];say(`Localizando clínicas novas: ${j+1} de ${todo.length}…`,"ok");
    const g=net?await geoNet(c,ref):null;
    if(g){c.la=g.la;c.lo=g.lo;R.net++;R.rev.push([c,"localizada pela internet (conferir)"]);continue}
    const e=estimate(c,ref);
    if(e){c.la=e.la;c.lo=e.lo;c.ap=1;e.m=="cep"?R.cep++:R.cid++;R.rev.push([c,e.m=="cep"?"estimada pelo CEP":"estimada pela cidade"])}
    else{R.sem++;R.rev.push([c,"sem localização"])}
  }
  PLAN={list:[...mp.values()],S:S2,R,mode};say("");
  const t=PLAN.list.length;
  $("#adm-out").innerHTML=`<div class="step"><b>3. Conferir e gerar a base</b><p class="rep"><b>${ROWS.length}</b> linhas lidas. Base atual: <b>${C.length}</b> clínicas → nova base: <b>${t}</b>.<br>`+
   (mode=="merge"?`Novas: <b>${R.novas}</b> · Atualizadas: <b>${R.atual}</b> · Removidas: <b>${R.rem}</b> · Ignoradas: <b>${R.ign}</b>`:`Clínicas incluídas: <b>${R.novas}</b> · Ignoradas: <b>${R.ign}</b>`)+
   `<br>Localização: informada ou mantida <b>${R.inf}</b> · encontrada pela internet <b>${R.net}</b> · estimada pelo CEP <b>${R.cep}</b> · estimada pela cidade <b>${R.cid}</b> · sem localização <b>${R.sem}</b></p>`+
   R.prob.map(p=>`<div class="warn">${esc(p)}</div>`).join("")+
   `<div class="act"><button class="go" type="button" id="pub"${t?"":" disabled"}>Baixar base.json</button>${R.rev.length?'<button class="btn" type="button" id="b-rev">Baixar lista para revisão (.csv)</button>':""}</div>`+
   `<p class="mu">Depois de baixar, envie o arquivo <b>base.json</b> para o repositório no GitHub, substituindo o anterior.</p></div>`;
  $("#pub").onclick=()=>{const L=PLAN.list.map(c=>({n:c.n,e:c.e,nu:c.nu,cp:c.cp,b:c.b,ci:c.ci,u:c.u,cep:c.cep,p:c.p,t:c.t,s:c.s,h:c.h,ap:c.ap,la:c.la,lo:c.lo}));baixar("base.json",new Blob([JSON.stringify({c:L,s:PLAN.S,r:RNG,upd:hoje()})],{type:"application/json"}))};
  if($("#b-rev"))$("#b-rev").onclick=revisao;
}
function revisao(){
  const q=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const l=["NOME;ENDEREÇO;CIDADE;UF;CEP;SITUAÇÃO DA LOCALIZAÇÃO",...PLAN.R.rev.map(([c,m])=>[c.n,[c.e,c.nu].filter(Boolean).join(", "),c.ci,c.u,c.cep,m].map(q).join(";"))];
  baixar("revisar-localizacao.csv","\ufeff"+l.join("\r\n"));
}

$("#b-mod").onclick=modelo;$("#b-base").onclick=exportar;
document.querySelectorAll("input[name=md]").forEach(r=>r.onchange=plano);
$("#arq").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;say("");
  try{
    if(/\.csv$/i.test(f.name))ROWS=parseCSV(await f.text());
    else{if(needX())return;
      const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});
      const nm=wb.SheetNames.find(n=>norm(n).replace(/\W/g,"")!="instrucoes")||wb.SheetNames[0];
      ROWS=XLSX.utils.sheet_to_json(wb.Sheets[nm],{defval:"",raw:false})}
    if(!ROWS.length)return say("A planilha está vazia.","warn");
    plano();
  }catch(err){say("Não consegui ler o arquivo: "+err.message,"warn")}
};

fetch("base.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{D=d;C=d.c;S=d.s;$("#cur").textContent=`Base atual: ${C.length.toLocaleString("pt-BR")} clínicas, atualizada em ${d.upd}.`})
 .catch(()=>{$("#cur").textContent="Não encontrei o base.json ao lado desta página. Use o modo “Substituir a base inteira”."});

</script>
</body>
</html>
